[package]
name = "dataos-wlan-tunnel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
dataos-qmi = { path = "../qmi" }
dataos-netcfg = { path = "../netcfg" }
dataos-datacore = { path = "../datacore" }
dataos-datad = { path = "../datad" }

[features]
# The simulated modem and the fake kernel, for the tests of this crate.
fake = []

[dev-dependencies]
dataos-wlan-tunnel = { path = ".", features = ["fake"] }
dataos-datad = { path = "../datad", features = ["fake"] }
