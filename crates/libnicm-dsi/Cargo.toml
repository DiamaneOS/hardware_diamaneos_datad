[package]
name = "dataos-libnicm-dsi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# An rlib for the host tests. Soong builds the shared library libnicm_dsi.so from the same source.
[lib]
path = "src/lib.rs"

[dependencies]
dataos-nicm-abi = { path = "../nicm-abi" }

[dev-dependencies]
dataos-libnicm = { path = "../libnicm" }
dataos-wire = { path = "../wire" }
dataos-datacore = { path = "../datacore", features = ["sim"] }
dataos-datad = { path = "../datad" }
dataos-netcfg = { path = "../netcfg", features = ["fake"] }
