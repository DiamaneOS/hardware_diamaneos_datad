[package]
name = "dataos-datad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
dataos-qmi = { path = "../qmi" }
dataos-netcfg = { path = "../netcfg" }
dataos-datacore = { path = "../datacore" }
dataos-wire = { path = "../wire" }
dataos-nicm-abi = { path = "../nicm-abi" }

[features]
# The fake of the QRTR sockets and the name service, for the tests of this crate and of the runtime.
fake = []

[dev-dependencies]
dataos-datad = { path = ".", features = ["fake"] }
dataos-netcfg = { path = "../netcfg", features = ["fake"] }
dataos-datacore = { path = "../datacore", features = ["sim"] }
